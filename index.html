<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f2">
    <meta name="description" content="히라가나와 가타카나 발음을 한글과 로마자로 반복 연습하세요.">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Kana Loop</title>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#quiz" data-page="quiz">
          <span class="brand-mark" lang="ja" aria-hidden="true">あ</span>
          <span>Kana Loop</span>
        </a>
        <div class="today" aria-label="오늘 학습">
          <span>오늘</span><strong id="today-count">0문항</strong><span class="today-divider" aria-hidden="true"></span><strong id="today-accuracy">—</strong>
        </div>
        <nav aria-label="메인 메뉴">
          <button type="button" data-page="stats">통계</button>
          <button type="button" data-page="settings">설정</button>
        </nav>
      </header>
      <p id="global-status" class="status" role="status" hidden></p>
      <section id="error-panel" class="error-panel" aria-label="저장 오류" hidden>
        <p id="error-message" role="alert"></p>
        <button id="retry" type="button">다시 시도</button>
      </section>
      <main aria-busy="true">
        <section id="quiz" class="quiz" aria-label="가나 연습">
          <div id="quiz-content" hidden>
            <div class="prompt-card">
              <div class="prompt-meta"><span id="question-category"></span><span id="question-pool"></span></div>
              <div id="question-kana" class="kana" lang="ja"></div>
            </div>
            <form id="answer-form">
              <label class="answer-label" for="answer">발음 입력</label>
              <div class="answer-field">
                <input id="answer" type="text" placeholder="한글 또는 로마자" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="feedback">
                <button id="submit-answer" class="primary" type="submit">제출</button>
              </div>
            </form>
          </div>
          <div id="quiz-empty" class="empty-card">
            <p id="empty-message" role="status" tabindex="-1">학습 기록을 불러오는 중입니다.</p>
            <button id="open-settings" type="button" data-page="settings" hidden>학습 범위 설정</button>
          </div>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
          <footer class="quiz-footer">
            <div class="shortcuts"><span><kbd>Enter</kbd> 제출 / 다음</span><span><kbd>Esc</kbd> 건너뛰기</span><span><kbd>Ctrl</kbd> + <kbd>Z</kbd> 채점 취소</span></div>
            <span class="streak">연속 정답 <strong id="streak">0</strong></span>
          </footer>
        </section>
        <section id="settings" class="subpage" aria-labelledby="settings-title" hidden>
          <div class="page-heading">
            <h1 id="settings-title" tabindex="-1">학습 설정</h1>
            <button id="start-quiz" class="primary" type="button" data-page="quiz">학습 시작</button>
          </div>
          <div class="section-card">
            <div class="section-heading"><h2>출제 범위</h2><span id="settings-count" class="count-pill" role="status"></span></div>
            <div id="presets" class="presets" role="group" aria-label="범위 프리셋">
              <button data-preset="all" type="button">전체</button>
              <button data-preset="hiragana" type="button">히라가나</button>
              <button data-preset="katakana" type="button">가타카나</button>
              <button data-preset="basic" type="button">기본 46자</button>
              <button data-preset="weak" type="button" aria-pressed="false">취약 문자</button>
              <button data-preset="clear" type="button">전체 해제</button>
            </div>
            <div id="filter-groups"></div>
            <p class="hint">ん과 ン은 단에 속하지 않습니다. 단을 모두 선택하거나 ん 행만 선택하면 포함됩니다.</p>
            <p id="filter-warning" class="filter-warning" role="status" hidden></p>
          </div>
          <div class="section-card">
            <div class="section-heading"><h2>학습 기록</h2><span id="storage-status" class="hint"></span></div>
            <div class="data-actions">
              <button id="export-backup" type="button">JSON 내보내기</button>
              <button id="import-backup" type="button">JSON 가져오기</button>
              <input id="backup-file" type="file" accept=".json,application/json" hidden>
              <button id="persist-storage" type="button" hidden>저장 유지 요청</button>
            </div>
            <div class="data-actions reset-actions">
              <button id="reset-scope" type="button">현재 범위 기록 초기화</button>
              <button id="reset-all" type="button">전체 기록 초기화</button>
            </div>
          </div>
        </section>
        <section id="stats" class="subpage" aria-labelledby="stats-title" hidden>
          <div class="page-heading"><h1 id="stats-title" tabindex="-1">학습 통계</h1><button type="button" data-page="quiz">연습으로</button></div>
          <div id="stat-summary" class="stat-summary"></div>
          <div class="section-card">
            <div class="section-heading">
              <h2>문자별 기록</h2>
              <div class="segments" role="group" aria-label="통계 범위">
                <button type="button" data-stat-scope="all" aria-pressed="true">전체</button>
                <button type="button" data-stat-scope="current" aria-pressed="false">현재 범위</button>
              </div>
            </div>
            <div class="table-scroll">
              <table>
                <thead><tr><th scope="col">가나</th><th scope="col">시도</th><th scope="col">누적 정답률</th><th scope="col">최근 10회</th><th scope="col">숙련도</th><th scope="col">취약 순위</th></tr></thead>
                <tbody id="stat-rows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog id="confirmation" aria-labelledby="dialog-title">
      <form method="dialog">
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <div class="dialog-actions">
          <button id="dialog-backup" type="button" hidden>현재 기록 내보내기</button>
          <button value="cancel" autofocus>취소</button>
          <button id="dialog-confirm" class="primary" value="confirm"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
